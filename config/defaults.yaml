# MarketFish v5 — Default Configuration
# Override: create config/user_settings.yaml (gitignored)
# Secrets: .env file (never in YAML)

pipeline:
  simulation_rounds: 30
  market_types: [b2c, smb]          # which markets to simulate
  agent_consumer_cap: 50            # max consumers in simulation
  product_fallback_count: 3         # products to use when no market match
  target_market_fallback: consumer  # fallback target_market

simulation:
  rounds: 30
  batch_size: 15                    # ThreadPool workers per round
  agent_timeout: 30                 # seconds per agent LLM call
  competitor_activate_round: 8      # competitors enter at this round
  environment_period: 5             # environment agents act every N rounds
  products_shown: 3                 # products shown to each agent
  context_max_chars: 3000           # max chars in agent decision context
  recommend_connections: 5          # peers an agent can recommend to
  log_interval: 5                   # progress log every N rounds

  # Survival score formula
  score_adoption_weight: 0.4
  score_retention_weight: 0.3
  score_revenue_weight: 0.3
  score_adoption_denominator: 0.1
  score_revenue_per_user_baseline: 50

  # Status thresholds
  alive_threshold: 0.3
  struggling_threshold: 0.1

  # Random seed (0 = random each run)
  random_seed: 42

coupling:
  # Emotion → WTP multiplier
  emotion_wtp_multiplier:
    excited: 1.30
    satisfied: 1.10
    curious: 1.05
    neutral: 1.00
    indifferent: 0.85
    skeptical: 0.70
    frustrated: 0.50

  # Emotion → valence (-1.0 to 1.0)
  emotion_valence:
    excited: 1.0
    satisfied: 0.7
    curious: 0.4
    neutral: 0.0
    indifferent: -0.1
    skeptical: -0.4
    frustrated: -0.8

  # Valence → emotion thresholds (checked in order)
  valence_thresholds:
    - [0.8, excited]
    - [0.5, satisfied]
    - [0.2, curious]
    - [-0.1, neutral]
    - [-0.3, indifferent]
    - [-0.6, skeptical]
    - [-1.0, frustrated]

  negativity_spread_multiplier: 2.0
  fomo_peer_threshold: 3
  fomo_purchase_boost: 0.25
  fomo_partial_2_peers: 0.5
  fomo_partial_1_peer: 0.2
  contagion_strength: 0.15
  market_sentiment_weight: 0.10
  influence_susceptibility_factor: 0.2
  min_susceptibility: 0.05
  trending_lookback_rounds: 3
  trending_top_n: 3
  trending_min_count: 2
  fomo_activation_adoption_rate: 0.3

rl:
  alpha: 0.08

  reward_satisfied_purchase: 0.15
  reward_recommendation_match: 0.12
  penalty_churn: -0.20
  penalty_missed_trend: -0.08
  penalty_overpaid: -0.10

  risk_reward_ratio: 0.5
  churn_risk_penalty_ratio: 0.5
  overpaid_price_sensitivity_boost: 0.05
  overpaid_threshold_multiplier: 1.5
  sentiment_optimistic_threshold: 0.3
  sentiment_pessimistic_threshold: -0.3
  sentiment_risk_adjustment: 0.03

  recommend_check_rounds: 5
  peer_purchase_check_rounds: 3
  strategy_shift_epsilon: 0.001

  # Init from profile
  init_noise_range: 0.08
  budget_price_sens_divisor: 2000
  budget_price_sens_cap: 0.8
  tech_early_adopter_factor: 0.6
  impulse_early_adopter_bonus: 0.3
  influence_susceptibility_factor: 0.3
  high_influence_susceptibility_min: 0.2
  slow_decision_loyalty_bonus: 0.2
  base_loyalty: 0.3
  tech_risk_tolerance_factor: 0.5
  desires_risk_tolerance_factor: 0.05

  # Behavior description thresholds
  behavior_thresholds:
    price_sensitive_high: 0.7
    price_sensitive_low: 0.3
    early_adopter_high: 0.6
    early_adopter_low: 0.2
    social_susceptible_high: 0.6
    social_susceptible_low: 0.2
    loyal_high: 0.6
    loyal_low: 0.2
    risk_tolerant_high: 0.6
    risk_tolerant_low: 0.2

  # Strategy bounds per agent type
  agent_type_bounds:
    consumer:
      price_sensitivity: [0.3, 0.9]
      early_adopter: [0.1, 0.8]
      social_susceptibility: [0.2, 0.9]
      loyalty: [0.1, 0.7]
      risk_tolerance: [0.1, 0.7]
    smb:
      price_sensitivity: [0.5, 1.0]
      early_adopter: [0.05, 0.4]
      social_susceptibility: [0.1, 0.6]
      loyalty: [0.3, 0.9]
      risk_tolerance: [0.05, 0.4]
    enterprise:
      price_sensitivity: [0.4, 0.8]
      early_adopter: [0.0, 0.2]
      social_susceptibility: [0.0, 0.3]
      loyalty: [0.5, 1.0]
      risk_tolerance: [0.0, 0.2]
    competitor:
      price_sensitivity: [0.6, 1.0]
      early_adopter: [0.3, 0.9]
      social_susceptibility: [0.0, 0.3]
      loyalty: [0.0, 0.3]
      risk_tolerance: [0.5, 1.0]
    environment:
      price_sensitivity: [0.3, 0.7]
      early_adopter: [0.2, 0.6]
      social_susceptibility: [0.2, 0.6]
      loyalty: [0.3, 0.7]
      risk_tolerance: [0.2, 0.6]
    default:
      price_sensitivity: [0.2, 0.8]
      early_adopter: [0.1, 0.7]
      social_susceptibility: [0.1, 0.7]
      loyalty: [0.1, 0.7]
      risk_tolerance: [0.1, 0.7]

backtest:
  hard_pass_simple_ux: 30
  hard_pass_consumer_b2c: 30
  soft_signal_solves_fear: 15
  soft_signal_social_sharing: 15
  smb_onetime_partial: 10
  kill_b2b_subscription: -40
  kill_high_price_monthly: -20

  high_price_threshold_cny: 100
  promising_threshold: 50
  risky_threshold: 30

  ux_simple_keywords: [one-click, single action, auto, instant, no login, no signup, one tap, voice, photo, screenshot, scan]
  ux_simple_categories: [consumer_app, mini_program, browser_extension]
  fear_keywords: [fear, anxiety, lonely, die, death, safety, security, embarrass, shame, lose, lost, forget, miss, scared, emotional, feel, stress, pressure, anxious]
  share_keywords: [share, viral, social, friend, wechat moment, 朋友圈, recommend, invite, challenge, leaderboard, group]
  subscription_indicators: [/month, subscription]

network:
  beta: 0.1
  k_min: 4
  k_max: 12
  k_divisor: 8

agent_generation:
  batch_timeout: 300
  batch_retries: 3
  max_workers: 6
  min_consumers_warn: 30
  min_smb_warn: 10
  context_kg_chars: 3000
  context_ideas_chars: 2000
  temperature: 0.8

report:
  student_input_chars: 5000
  teacher_input_chars: 3000
  synthesis_report_chars: 5000
  perspectives:
    - role: 消费者视角
      focus: "Which products actually solved consumer pain points?"
    - role: 投资人视角
      focus: "Which products have the highest ceiling and lowest risk?"
    - role: 竞品视角
      focus: "Which products threaten existing players and how would they respond?"
    - role: 宏观视角
      focus: "How do economic conditions affect which products survive?"

domain:
  language: zh
  currency: CNY
  context: "2026 China, consumption downgrade, OPC boom, AI cost collapse, WeChat ecosystem dominance"

