  - requires_onboarding
  id: flip_shopping
  name: Flip (社交购物)
  outcome: failure
  pricing: 免费+佣金
  target_market: consumer
- category: consumer_app
  description: 10分钟极速送餐。自建暗厨房+骑手。主打鲜食。
  evidence: 2025中关闭。重资产模式烧钱, 用户宁愿等30分钟吃自己喜欢的店
  factors:
  - complex_ux
  id: zing_food
  name: Zing Food (10分钟送餐)
  outcome: failure
  pricing: 免费配送+餐费
  target_market: consumer
- category: B2B_saas
  description: AI品牌可见度监测。需解释GEO概念。¥99-1299/月订阅。需onboarding培训。
  evidence: 200+次检测, 0付费转化。B2B订阅+需教育市场+抽象概念=三重debuff
