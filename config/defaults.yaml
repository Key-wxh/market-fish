  - requires_onboarding
  id: koo
  name: Koo (印度微博)
  outcome: failure
  pricing: 免费+广告
  target_market: consumer
- category: consumer_app
  description: TikTok式短视频购物App。$230M融资, $1.1B估值。
  evidence: 2025.8 关闭。获客成本过高, 美国社交购物不成熟, 烧完融资
