agent_batches:
- agent_type: consumer
  count: 25
  diversity: Age 20-35, tier 1-2 cities, income 5000-20000 CNY. Mix of impulse buyers
    and researchers. Include students, freelancers, young professionals.
  label: Young urbanites
- agent_type: consumer
  count: 25
  diversity: Age 30-50, tier 2-3 cities, income 8000-30000 CNY. Parents, homeowners.
    Value-conscious, comparison shoppers.
  label: Family budgeters
- agent_type: consumer
  count: 25
  diversity: 'Age 18-55, tier 3-5 cities and rural, income 2000-10000 CNY. Less tech-savvy.
    Pain: limited services, information gap, price sensitivity.'
  label: Small town & rural
- agent_type: smb
  count: 15
  diversity: Restaurant owners, beauty salon, convenience store, repair shop. Income
    5000-50000 CNY monthly.
  label: Local service SMBs
- agent_type: smb
  count: 15
  diversity: WeChat store, Douyin live seller, Xiaohongshu KOL, freelancer agent.
    Income 3000-100000 CNY monthly.
  label: Online micro-businesses
- agent_type: enterprise
  count: 10
  diversity: Procurement managers, IT directors at 50-500 employee companies. Budget
    5000-100000 CNY monthly.
  label: SME decision makers
- agent_type: competitor
  count: 8
  diversity: Existing SaaS/tool providers. Include AI-native startups and traditional
    software vendors.
  label: Market incumbents
- agent_type: environment
  count: 5
  diversity: Economic trends, policy signals, technology shifts, platform rule changes.
  label: Macro factors
