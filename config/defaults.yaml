calibration_cases:
- category: consumer_app
  description: 每日签到打卡→连续2天未签就通知紧急联系人。极简：打开app点一下。恐惧驱动：独居怕出事没人知道。
  evidence: 2026.1 中国App Store付费榜#1, 60+投资人主动联系, 开发成本仅¥1500, 估值数千万
  factors:
  - dead_simple_ux
  - solves_real_fear
  - social_sharing
  - consumer_b2c
  id: demumu
  name: 死了么 (Demumu)
  outcome: success
  pricing: ¥8 一次性
  target_market: consumer
- category: consumer_app
  description: 拍照补光工具。打开就是补光灯，没别的功能。1小时开发完成。
  evidence: 当天冲上付费榜#1, 1小时开发时间, 零营销成本
  factors:
  - dead_simple_ux
  - consumer_b2c
  id: kitten_light
  name: 小猫补光灯
  outcome: success
  pricing: ¥1 一次性
  target_market: consumer
- category: consumer_app
  description: 'AI语言学习App，带吐槽模式。Freemium: 免费病毒传播→$9.99/月付费。TikTok有机增长。'
  evidence: 300万用户, $500K/月收入, 零广告费, 全靠TikTok自然传播
  factors:
  - social_sharing
  - consumer_b2c
  - solves_real_fear
  id: pingo
  name: Pingo
  outcome: success
  pricing: freemium → $9.99/月
  target_market: consumer
- category: consumer_app
  description: 拍照识别食物→计算卡路里。AI视觉+营养数据库。青少年独立开发。
  evidence: 17岁开发者, 年收入$30M, 2年做到
  factors:
  - dead_simple_ux
  - solves_real_fear
  - consumer_b2c
  id: calorie_snap
  name: 卡路里拍照计算 (Cal AI)
  outcome: success
  pricing: freemium
  target_market: consumer
- category: consumer_app
  description: 一键录屏+语音解说，即时生成分享链接。替代长邮件和会议。
  evidence: 2023年被Atlassian以$975M收购, 1400万用户, 极简录屏分享
  factors:
  - dead_simple_ux
  - social_sharing
  - consumer_b2c
  id: loom
  name: Loom
  outcome: success
  pricing: freemium → $12.5/月
  target_market: consumer
- category: consumer_app
  description: 冥想和睡眠App。解决焦虑和失眠恐惧。订阅制。
  evidence: 估值$2B, 400万付费用户, 睡眠故事是killer feature
  factors:
  - solves_real_fear
  - consumer_b2c
  id: calm
  name: Calm
  outcome: success
  pricing: $69.99/年
  target_market: consumer
- category: consumer_app
  description: 游戏化语言学习App。免费+广告/付费。每日打卡机制。
  evidence: 上市市值$10B+, 5亿+下载, 日活3000万, 社交排行榜+打卡机制
  factors:
  - social_sharing
  - consumer_b2c
  - dead_simple_ux
  id: duolingo
  name: Duolingo
  outcome: success
  pricing: freemium → $6.99/月
  target_market: consumer
- category: consumer_app
  description: Mac窗口管理器。一键整理桌面窗口布局。极简：拖拽→自动排列。
  evidence: Product Hunt Top 5, 独立开发者单人完成, 月入$5K+
  factors:
  - dead_simple_ux
  - consumer_b2c
  id: controol
  name: Controol
  outcome: success
  pricing: ¥68 一次性
  target_market: consumer
- category: B2B_saas
  description: All-in-one 笔记+项目管理+数据库。个人免费→团队付费。
  evidence: 估值$10B, 1亿用户, 从个人消费者渗透到企业
  factors:
  - social_sharing
  - dead_simple_ux
  id: notion
  name: Notion
  outcome: success
  pricing: freemium → $10/月/人
  target_market: smb
- category: browser_extension
  description: 浏览器开发工具合集。CSS检查+截图+颜色提取。Chrome扩展。
  evidence: '单人开发者, $2K MRR, Product Hunt #1 of the week'
  factors:
  - dead_simple_ux
  - consumer_b2c
  id: hoverify
  name: Hoverify
  outcome: success
  pricing: $24 一次性
  target_market: smb
- category: B2B_saas
  description: 一键注册美国公司+银行账户。面向全球创业者。API-first。
  evidence: Stripe 旗下, 数万公司通过其注册, 解决跨境创业最大痛点
  factors:
  - dead_simple_ux
  - solves_real_fear
  id: stripe_atlas
  name: Stripe Atlas
  outcome: success
  pricing: $500 一次性
  target_market: smb
- category: consumer_app
  description: 付费壁纸订阅App。$50/年 或 $12/月。MKBHD (2000万粉丝) 背书。
  evidence: 2025.12 关闭。仅90万下载, $95K收入。消费者不愿为壁纸付费。隐私争议。
  factors:
  - high_price_monthly
  - complex_ux
  id: panels_mkbhd
  name: Panels (MKBHD 壁纸App)
  outcome: failure
  pricing: $50/年 订阅
  target_market: consumer
- category: consumer_app
  description: 多语言Twitter替代品。主打印度市场。需要解释为什么不用Twitter。
  evidence: 2024.7 关闭。未建立差异化, 融资失败, 用户流失回Twitter
